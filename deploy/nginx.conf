# Nginx конфигурация для всех доменов
# Разместить в /etc/nginx/sites-available/charityfond
# Создать симлинк: ln -s /etc/nginx/sites-available/charityfond /etc/nginx/sites-enabled/

# Upstream для Next.js фронтенда
upstream frontend {
    server localhost:3000;
    keepalive 64;
}

# Upstream для NestJS бэкенда
upstream backend {
    server localhost:3001;
    keepalive 64;
}

# Default server для обработки запросов по IP (HTTP редирект на HTTPS)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Редирект на HTTPS (используем IP, если нет домена)
    return 301 https://$host$request_uri;
}

# Default server для обработки запросов по IP (HTTPS с самоподписанным сертификатом)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    
    # Временный самоподписанный сертификат для IP запросов
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # Логи
    access_log /var/log/nginx/charityfond-default.access.log;
    error_log /var/log/nginx/charityfond-default.error.log;

    # Максимальный размер загружаемых файлов
    client_max_body_size 50M;

    # Проксирование API запросов на бэкенд
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Статические файлы
    location /images {
        alias /var/www/charityfond/frontend/public/images;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Проксирование всех остальных запросов на фронтенд
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# HTTP редирект на HTTPS для английских доменов
server {
    listen 80;
    listen [::]:80;
    server_name charityfond.online www.charityfond.online charityfond.ru www.charityfond.ru charityfond.store www.charityfond.store;

    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS для английских доменов - charityfond.online, charityfond.ru, charityfond.store
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name charityfond.online www.charityfond.online charityfond.ru www.charityfond.ru charityfond.store www.charityfond.store;

    # SSL сертификаты Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/charityfond.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/charityfond.online/privkey.pem;

    # Логи
    access_log /var/log/nginx/charityfond-en.access.log;
    error_log /var/log/nginx/charityfond-en.error.log;

    # Максимальный размер загружаемых файлов
    client_max_body_size 50M;

    # Проксирование API запросов на бэкенд
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Проксирование всех остальных запросов на фронтенд
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Статические файлы - прямое обслуживание через Nginx для лучшей производительности
    location /images {
        alias /var/www/charityfond/frontend/public/images;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /favicon.ico {
        alias /var/www/charityfond/frontend/public/favicon.ico;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Статические файлы Next.js
    location /_next/static {
        alias /var/www/charityfond/frontend/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# HTTP редирект на HTTPS для русских доменов
server {
    listen 80;
    listen [::]:80;
    server_name творцыдобра.рф www.творцыдобра.рф творецдобра.рф www.творецдобра.рф странадобра.рф www.странадобра.рф творцы-добра.рф www.творцы-добра.рф творец-добра.рф www.творец-добра.рф страна-добра.рф www.страна-добра.рф;

    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

